<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="emsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
  </defs>

  <rect width="880" height="140" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" />
  <rect x="0" y="0" width="5" height="140" rx="2" fill="url(#emsAccent)" />

  <text x="26" y="34" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Signatures-EMS</text>
  
  <rect x="175" y="18" width="130" height="22" rx="11" fill="#1f2937" stroke="#38bdf8" stroke-width="0.8" />
  <text x="240" y="33" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">.NET 8 / C# WINFORMS</text>
  
  <rect x="315" y="18" width="150" height="22" rx="11" fill="#1f2937" stroke="#30363d" stroke-width="0.8" />
  <text x="390" y="33" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">MODULAR N-TIER ARCH</text>

  <text x="26" y="65" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Commercial-grade Offline Employee &amp; Payroll Management System</text>
  <text x="26" y="86" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Architected with an 8-layer decoupled system (BOS.Core, BOS.Engine, BOS.Database, BOS.Services, BOS.ThemeEngine, BOS.Controls).</text>
  <text x="26" y="105" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Includes embedded SQLite persistence, multi-session payroll computation, salary advances, and multi-format export (PDF, Excel, Print).</text>

  <text x="26" y="126" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">KEY MODULES: Employee Registry · Daily Production · Payroll Sessions · Custom Theme Engine · SQLite Storage</text>
</svg>
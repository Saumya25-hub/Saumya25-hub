<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.05; transform: scale(1); }
        50% { opacity: 0.12; transform: scale(1.05); }
      }
      @keyframes beaconPulse {
        0% { r: 3.5; opacity: 1; stroke-width: 1; }
        50% { r: 7; opacity: 0; stroke-width: 3; }
        100% { r: 3.5; opacity: 1; stroke-width: 1; }
      }
      .cursor-blink { animation: blink 1s infinite; }
      .data-bus { stroke-dasharray: 6 6; animation: flowData 2s linear infinite; }
      .pulse-beacon { animation: beaconPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .ambient-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    </style>

    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="heroTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="880" height="240" rx="10" fill="url(#heroBg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="880" height="240" rx="10" fill="url(#techGrid)" />

  <!-- Ambient Light with Pulse -->
  <circle cx="820" cy="50" r="130" fill="#38bdf8" class="ambient-pulse" filter="url(#heroGlow)" />
  <circle cx="90" cy="200" r="110" fill="#818cf8" class="ambient-pulse" filter="url(#heroGlow)" />

  <!-- Animated Architecture Data Bus Lines -->
  <path d="M 48 46 L 560 46 L 580 66 L 580 180" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.4" />
  <path d="M 48 46 L 560 46 L 580 66 L 580 180" fill="none" stroke="#38bdf8" stroke-width="1.2" class="data-bus" />
  
  <circle cx="48" cy="46" r="3" fill="#38bdf8" />
  <circle cx="580" cy="66" r="3" fill="#818cf8" />
  <circle cx="580" cy="180" r="3" fill="#34d399" />

  <!-- Top Status Badge with Pulsing LED -->
  <g transform="translate(48, 28)">
    <rect width="180" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#34d399" />
    <circle cx="12" cy="11" r="3.5" fill="none" stroke="#34d399" class="pulse-beacon" />
    <text x="24" y="15" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">SYSTEM ONLINE // PROD_v2.4</text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="98" fill="url(#heroTitle)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">SAUMYA CHAUDHARI</text>

  <!-- Subtitle -->
  <text x="48" y="128" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2">Software &amp; Systems Developer</text>

  <!-- Philosophy Quote -->
  <text x="48" y="160" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">“Building software because I enjoy understanding how things work.”</text>

  <!-- Micro Specs Tagline -->
  <g transform="translate(48, 186)">
    <rect width="90" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="45" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">.NET 8 / C#</text>
    
    <rect x="98" y="0" width="82" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="139" y="15" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">SYSTEMS</text>

    <rect x="188" y="0" width="80" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="228" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">KOTLIN</text>

    <rect x="276" y="0" width="94" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="323" y="15" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">FULL-STACK</text>
  </g>

  <!-- Right Side Architecture Spec Terminal Box with Animated Blinking Cursor -->
  <g transform="translate(596, 36)">
    <rect width="236" height="168" rx="8" fill="#161b22" fill-opacity="0.9" stroke="#30363d" stroke-width="1" />
    
    <rect x="0" y="0" width="236" height="28" rx="8" fill="#1c2128" />
    <circle cx="16" cy="14" r="4" fill="#ff5f56" />
    <circle cx="28" cy="14" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="14" r="4" fill="#27c93f" />
    <text x="135" y="18" fill="#7d8590" font-family="Consolas, Monaco, monospace" font-size="10.5" font-weight="600" text-anchor="middle">SYS_DISPATCH.IO</text>

    <g transform="translate(16, 44)">
      <text x="0" y="10" fill="#58a6ff" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="600">> ARCH: N-Tier Modular</text>
      <text x="0" y="30" fill="#c9d1d9" font-family="Consolas, Monaco, monospace" font-size="11">> CORE: Desktop &amp; LowLevel</text>
      <text x="0" y="50" fill="#c9d1d9" font-family="Consolas, Monaco, monospace" font-size="11">> DATA: SQLite / Relational</text>
      <text x="0" y="70" fill="#c9d1d9" font-family="Consolas, Monaco, monospace" font-size="11">> UI: Decoupled Engines</text>
      <text x="0" y="90" fill="#34d399" font-family="Consolas, Monaco, monospace" font-size="11">> STATUS: Production Active</text>
      
      <!-- Live Command line with blinking block cursor -->
      <text x="0" y="112" fill="#38bdf8" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="600">> ready</text>
      <rect x="48" y="102" width="7" height="12" fill="#38bdf8" class="cursor-blink" />
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="210" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Tech Grid Background Pattern -->
  <rect width="880" height="210" rx="12" fill="url(#grid)" />

  <!-- Ambient Glow Elements -->
  <circle cx="800" cy="40" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="70" cy="180" r="110" fill="#6366f1" opacity="0.07" filter="url(#glow)" />

  <!-- Terminal/Badge Header -->
  <g transform="translate(36, 32)">
    <rect width="180" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#38bdf8" />
    <text x="26" y="16" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SYSTEMS &amp; DESKTOP</text>
  </g>

  <!-- Main Name Title -->
  <text x="36" y="98" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">SAUMYA CHAUDHARI</text>

  <!-- Subtitle / Title -->
  <text x="36" y="128" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2">Software &amp; Systems Developer</text>

  <!-- Philosophy Quote -->
  <text x="36" y="156" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">“Building software because I enjoy understanding how things work.”</text>

  <!-- Quick Spec Badges on Right -->
  <g transform="translate(620, 42)">
    <rect width="220" height="126" rx="8" fill="#161b22" fill-opacity="0.85" stroke="#30363d" stroke-width="1" />
    
    <text x="16" y="24" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CORE ARCHITECTURE</text>
    
    <g transform="translate(16, 40)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="14" y="8" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Modular .NET 8 / C# Desktop</text>
    </g>
    
    <g transform="translate(16, 64)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="14" y="8" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Low-Level Systems &amp; C</text>
    </g>
    
    <g transform="translate(16, 88)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="14" y="8" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Multi-Platform &amp; Full-Stack</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="36" y="186" width="808" height="1" fill="url(#borderGrad)" />
</svg>
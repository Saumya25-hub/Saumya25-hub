  <text x="24" y="68" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">A significant portion of my development work is maintained privately or within proprietary codebases.</text>
  <text x="24" y="88" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">These include multi-module commercial enterprise ERP systems, specialized desktop engines, native mobile utilities, and</text>
  <text x="24" y="106" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">internal systems software. The public repositories showcased here represent open-source modules and web interfaces.</text>

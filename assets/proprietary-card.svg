  <text x="24" y="98" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">For inquiries regarding specific architectural implementations or collaboration, feel free to connect.</text>
